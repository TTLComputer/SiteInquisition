# Runs only for release tags (v*) or when started by hand from the Actions tab.
# The repo's Actions budget is ~500 minutes/month, so day-to-day checks run locally
# (`pnpm build && pnpm test`, then `pnpm package` and `pnpm smoke`) before pushing.
# v1 is Linux only, so there is no Windows job.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # aioquic runs the HTTP/3 interop tests; xvfb runs the desktop smoke test.
      - run: sudo apt-get update && sudo apt-get install -y xvfb && pip install aioquic
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm package --out release
      - run: pnpm smoke release/linux-unpacked/siteinquisition
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/*.tar.gz release/*.deb --title "SiteInquisition ${GITHUB_REF_NAME}" --notes-file CHANGELOG.md --verify-tag
      - name: Keep the packages (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: siteinquisition-linux
          path: |
            release/*.tar.gz
            release/*.deb
          retention-days: 7
